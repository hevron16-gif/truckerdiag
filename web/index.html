<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1a1a" />
  <meta name="description" content="Диагностика китайских грузовиков Howo, Shacman, Yutong" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="TruckerDiag" />
  <title>TruckerDiag — Диагностика грузовиков</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-brand">
        <span class="logo" aria-hidden="true">⚙</span>
        <div>
          <h1>TruckerDiag</h1>
          <p class="tagline">ИИ-диагностика китайских грузовиков</p>
        </div>
      </div>
      <div id="api-status" class="api-status" title="Статус API">●</div>
    </header>

    <nav class="steps" aria-label="Шаги">
      <button type="button" class="step active" data-step="1" disabled>
        <span class="step-num">1</span><span class="step-label">Модель</span>
      </button>
      <button type="button" class="step" data-step="2" disabled>
        <span class="step-num">2</span><span class="step-label">Код</span>
      </button>
      <button type="button" class="step" data-step="3" disabled>
        <span class="step-num">3</span><span class="step-label">Результат</span>
      </button>
    </nav>

    <main class="main">
      <!-- Экран 1: модель -->
      <section id="screen-1" class="screen active" aria-label="Выбор модели">
        <h2 class="screen-title">Выберите технику</h2>
        <p class="screen-hint">Модель, двигатель и год выпуска</p>

        <label class="field">
          <span class="field-label">Модель</span>
          <select id="vehicle-model" class="input select">
            <option value="Howo A7">Howo A7</option>
            <option value="Howo T7H">Howo T7H</option>
            <option value="Shacman X3000">Shacman X3000</option>
            <option value="Yutong ZK6122">Yutong ZK6122</option>
          </select>
        </label>

        <label class="field">
          <span class="field-label">Двигатель</span>
          <select id="engine" class="input select"></select>
        </label>

        <label class="field">
          <span class="field-label">Год выпуска</span>
          <input id="year" class="input" type="number" min="2005" max="2026" value="2019" inputmode="numeric" />
        </label>

        <button type="button" id="btn-to-code" class="btn btn-primary">
          Далее — ввод кода
        </button>
      </section>

      <!-- Экран 2: код / фото -->
      <section id="screen-2" class="screen" aria-label="Код ошибки" hidden>
        <h2 class="screen-title">Код ошибки</h2>
        <p class="screen-hint" id="vehicle-summary"></p>

        <div class="tabs" role="tablist">
          <button type="button" class="tab active" role="tab" data-tab="manual" aria-selected="true">
            Вручную
          </button>
          <button type="button" class="tab" role="tab" data-tab="photo" aria-selected="false">
            Фото сканера
          </button>
        </div>

        <div id="panel-manual" class="tab-panel active">
          <label class="field">
            <span class="field-label">Код (например P1011, P0087, U0155)</span>
            <input
              id="error-code"
              class="input code-input"
              type="text"
              placeholder="P1011"
              autocomplete="off"
              autocapitalize="characters"
              spellcheck="false"
            />
          </label>
          <button type="button" id="btn-diagnose" class="btn btn-primary">
            Диагностировать
          </button>
        </div>

        <div id="panel-photo" class="tab-panel" hidden>
          <label class="upload-zone" id="upload-zone">
            <input id="photo-input" type="file" accept="image/*" capture="environment" hidden />
            <span class="upload-icon" aria-hidden="true">📷</span>
            <span class="upload-title">Сфотографируйте экран сканера</span>
            <span class="upload-sub">JPEG / PNG, до 5 МБ</span>
          </label>
          <div id="photo-preview-wrap" class="photo-preview-wrap" hidden>
            <img id="photo-preview" alt="Превью фото сканера" />
            <button type="button" id="btn-clear-photo" class="btn btn-ghost btn-sm">Убрать фото</button>
          </div>
          <button type="button" id="btn-diagnose-photo" class="btn btn-primary" disabled>
            Распознать и диагностировать
          </button>
        </div>

        <button type="button" id="btn-back-1" class="btn btn-ghost">← Назад</button>
      </section>

      <!-- Экран 3: результат -->
      <section id="screen-3" class="screen" aria-label="Результат" hidden>
        <div id="result-content"></div>
        <div class="result-actions">
          <button type="button" id="btn-new" class="btn btn-primary">Новая диагностика</button>
          <button type="button" id="btn-back-2" class="btn btn-ghost">← Другой код</button>
        </div>
      </section>
    </main>

    <div id="loading" class="loading" hidden>
      <div class="spinner"></div>
      <p id="loading-text">Диагностика…</p>
    </div>

    <div id="toast" class="toast" hidden role="status"></div>

    <footer class="footer">
      <span>API: <code id="api-url-label">localhost:8000</code></span>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
